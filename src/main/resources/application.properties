# ===== Server =====
server.port=8080
# Uncomment to enable HTTPS (configure keystore for production):
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# ===== Database (H2 in-memory for dev) =====
spring.datasource.url=jdbc:h2:mem:securedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# IMPORTANT: Override via environment variable in production
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-very-long-random-string-at-least-256-bits}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=86400000

# ===== Rate Limiting =====
app.rate-limit.capacity=20
app.rate-limit.refill-tokens=20
app.rate-limit.refill-duration-minutes=1

# ===== Actuator (restrict in production) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== Logging (avoid logging sensitive data) =====
logging.level.com.example.secureapi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
